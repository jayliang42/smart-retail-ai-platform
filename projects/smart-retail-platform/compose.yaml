services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smart_retail
      POSTGRES_USER: smart_retail
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_retail -d smart_retail"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - smart-retail-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://smart_retail:local-development-only@db:5432/smart_retail
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://smart_retail:local-development-only@db:5432/smart_retail
      SMART_RETAIL_API_KEYS: ${SMART_RETAIL_API_KEYS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  smart-retail-postgres:

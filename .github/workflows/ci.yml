name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/smart-retail-platform
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smart_retail_test
          POSTGRES_USER: smart_retail
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_retail -d smart_retail_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://smart_retail:ci-only-password@localhost:5432/smart_retail_test
      TEST_DATABASE_URL: postgresql+psycopg://smart_retail:ci-only-password@localhost:5432/smart_retail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/smart-retail-platform/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: basedpyright
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
      - name: Run 60-case deterministic Copilot regression suite
        run: >-
          smart-retail-evaluate-copilot
          data/evaluation/copilot_eval_v1.jsonl
          data/knowledge/manifest.json

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: projects/smart-retail-platform
          push: false
          tags: smart-retail-platform:ci
